<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
/* Layout: one column for one-handed phone use; big tap targets (min 52px); sections separated by space, cards only for grouped controls */
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --sunk:#ECE9E1; --line:#DAD5C9;
  --fg:#1F2420; --muted:#5F665F; --accent:#2F7A4F; --accent-ink:#FFFFFF; --accent-soft:#DDEFE3;
  --warn:#9A5A00; --warn-soft:#F7E8CF; --bad:#B42318; --bad-soft:#FBE3E0; --blue:#2D5DA8;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"IBM Plex Sans","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161A17; --surface:#20251F; --sunk:#2A3029; --line:#363D35;
  --fg:#EDEFEA; --muted:#A3AA9F; --accent:#6CC08E; --accent-ink:#0E1A12; --accent-soft:#1E3326;
  --warn:#F0B25A; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3D1D1A; --blue:#8DB4F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A17; --surface:#20251F; --sunk:#2A3029; --line:#363D35;
  --fg:#EDEFEA; --muted:#A3AA9F; --accent:#6CC08E; --accent-ink:#0E1A12; --accent-soft:#1E3326;
  --warn:#F0B25A; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3D1D1A; --blue:#8DB4F0; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
h1{font-size:26px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:21px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:16px}
section{display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* big check rows */
.chk{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left}
.chk .box{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.chk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] .box::after{content:"";width:8px;height:15px;border:solid var(--accent-ink);border-width:0 3.5px 3.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
.chk .t{font-weight:700;font-size:19px}
.chk .d{display:block;color:var(--muted);font-size:15px;font-weight:400}
.list{display:flex;flex-direction:column;gap:10px}
.done-banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.streak{font-size:15px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 12px;white-space:nowrap}
/* buttons */
.btn{border:0;border-radius:14px;min-height:56px;padding:12px 18px;font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:var(--sunk);color:var(--fg)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--fg)}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px;border-radius:12px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.link{border:0;background:none;padding:6px 4px;color:var(--accent);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px}
/* walk */
.walk{display:flex;align-items:baseline;gap:8px}
.walk .big{font-size:54px;font-weight:700;line-height:1}
.bar{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:7px}
.bar.over>i{background:var(--bad)}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field span{font-size:15px;color:var(--muted);font-weight:600}
.field input,.search input,.txt{width:100%;box-sizing:border-box;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px;font-size:20px}
.field input{font-family:var(--num);font-size:24px;font-weight:600}
.field input:focus,.search input:focus,.txt:focus{border-color:var(--accent);outline:none}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fields.two{grid-template-columns:1fr 1fr}
/* food */
.kcal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kcal .big{font-size:46px;font-weight:700;line-height:1}
.kcal .big.over{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;min-height:46px;padding:6px 16px;font-weight:600;font-size:17px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.sugg{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sugg a{text-decoration:none;color:inherit}
.sugg button,.sugg a{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:56px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;font-size:18px}
.sugg>:first-child{border-top:0}
.sugg button small,.sugg a small{color:var(--muted);font-size:15px;white-space:nowrap}
.sugg .ai{color:var(--accent);font-weight:700}
.sugg a.ai{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.sugg a.ai small{color:var(--muted);font-weight:400}
.sugg .wait{padding:14px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0;font-weight:600}
.item .nm small{display:block;color:var(--muted);font-weight:400;font-size:15px}
.qty{min-width:58px;min-height:44px;border:2px solid var(--line);background:var(--sunk);border-radius:12px;font-weight:700}
.x{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:26px;border-radius:12px;line-height:1}
.prot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prot button{min-height:56px;border:2px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.prot button small{font-weight:400;font-size:13px;color:var(--muted)}
.prot button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* bp */
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--accent-soft);color:var(--accent)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.reading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.reading:first-child{border-top:0}
.reading b{font-size:22px}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:600;font-size:16px}
.note{color:var(--muted);font-size:15px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:transparent;min-height:66px;font-size:17px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
/* records */
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid28 .c{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:14px;font-family:var(--num);color:var(--muted)}
.grid28 .c.all{background:var(--accent);color:var(--accent-ink);font-weight:700}
.grid28 .c.some{background:var(--warn-soft);color:var(--warn);font-weight:700}
.grid28 .c.today{outline:3px solid var(--blue);outline-offset:1px}
.grid28 .wd{font-size:13px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 4px 4px;min-height:3px}
.bars i.low{background:var(--line)}
.bars span{font-size:13px;color:var(--muted)}
.bars b{font-size:13px;font-family:var(--num)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;box-sizing:border-box;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.steps{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:10px;font-size:19px}
.steps li::marker{font-weight:700;color:var(--accent)}
.care{background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:17px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.med-edit{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.med-edit:first-child{border-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--sunk);border-radius:14px;padding:5px}
.seg button{border:0;background:transparent;min-height:48px;border-radius:10px;font-weight:700;color:var(--muted);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hello{display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  care:'아프지 않고 시원한 정도까지만 늘리세요. 반동을 주지 마세요.'}

const WALK_GOAL=[20,30,40];

const LS='geongang-sucheop-v1';
function keyOf(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
let TODAY=keyOf(new Date());
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);return keyOf(new Date(y,m-1,d+n))}
function wdOf(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getDay()}
const WD='일월화수목금토';
function r1(x){return Math.round(x*10)/10}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).replace(/\s+/g,'').toLowerCase()}

function blank(){return{profile:{name:'',sex:'f',age:null,height:null,goal:null,pace:300},meds:[],level:0,ai:{key:'',model:''},foods:[],days:{},setup:false,lastBackup:null}}
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw){const v=JSON.parse(raw);if(v&&v.profile)S=Object.assign(blank(),v)}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요. 백업 후 오래된 기록을 정리해 주세요.')}}
function day(k){let d=S.days[k];if(!d)d=S.days[k]={meds:{},walk:0,ex:{},knee:false,foods:[],prot:{},bp:[],weight:null};
  ['meds','ex','prot'].forEach(x=>{if(!d[x])d[x]={}});['foods','bp'].forEach(x=>{if(!Array.isArray(d[x]))d[x]=[]});return d}

let ui={tab:'today',sheet:null,food:'',aiBusy:false};

/* ---------- 계산 ---------- */
function latestWeight(){const ks=Object.keys(S.days).filter(k=>S.days[k].weight).sort();return ks.length?S.days[ks[ks.length-1]].weight:null}
function weightOn(k){const ks=Object.keys(S.days).filter(x=>x<=k&&S.days[x].weight).sort();return ks.length?S.days[ks[ks.length-1]].weight:(latestWeight()||65)}
function calTarget(){
  const p=S.profile;const w=latestWeight();if(!w||!p.age||!p.height)return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);
  const maint=Math.round(bmr*1.3);const floor=p.sex==='f'?1200:1400;
  const goalReached=p.goal&&w<=p.goal;
  const raw=goalReached?maint:maint-p.pace;
  return{bmr:Math.round(bmr),maint,target:Math.max(floor,Math.round(raw/10)*10),goalReached};
}
function walkKcal(k){const d=S.days[k];if(!d||!d.walk)return 0;return Math.round(3.5*weightOn(k)*d.walk/60)}
function foodSum(d){let k=0;(d.foods||[]).forEach(f=>k+=f.kcal*f.q);return Math.round(k)}
function medsDone(k){const d=S.days[k];if(!S.meds.length)return null;if(!d)return 0;return S.meds.filter(m=>d.meds[m.id]).length}
function medStreak(){if(!S.meds.length)return 0;let n=0,k=TODAY;if(medsDone(k)!==S.meds.length)k=addDays(k,-1);while(medsDone(k)===S.meds.length){n++;k=addDays(k,-1);if(n>999)break}return n}
function exList(d){return EXERCISES.map(e=>d&&d.knee&&e.knee?Object.assign({},e,e.knee,{id:e.id,alt:true}):e)}
function bpClass(s,dia){
  if(s>=180||dia>=110)return{t:'매우 높음',c:'b-bad',alert:'혈압이 매우 높아요. 5분 쉬고 다시 재 보세요. 계속 높거나 두통, 가슴 통증, 어지러움이 있으면 바로 병원에 연락하세요.'};
  if(s<90||dia<60)return{t:'낮음',c:'b-warn',alert:s<90?'혈압이 낮은 편이에요. 어지럽거나 기운이 없으면 병원에 문의하세요.':null};
  if(s>=160||dia>=100)return{t:'고혈압 2기',c:'b-bad'};
  if(s>=140||dia>=90)return{t:'고혈압 1기',c:'b-bad'};
  if(s>=130||dia>=80)return{t:'고혈압 전단계',c:'b-warn'};
  if(s>=120)return{t:'주의',c:'b-warn'};
  return{t:'정상',c:'b-ok'};
}

  const prevW=(()=>{const ks=Object.keys(S.days).filter(k=>k<TODAY&&S.days[k].weight).sort();return ks.length?S.days[ks[ks.length-1]].weight:null})();

function lineChart(series,opts){
  // series: [{pts:[[i,v]], color}], labels: x labels for first & last
  const W=340,H=170,L=34,R=14,T=12,B=26;
  const all=series.flatMap(s=>s.pts.map(p=>p[1])).concat(opts.guides?opts.guides.map(g=>g.v):[]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=Math.max(1,(hi-lo)*0.12);lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const n=opts.n;const x=i=>L+(n<=1?0:i/(n-1))*(W-L-R);const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[hi,Math.round((hi+lo)/2),lo];
  let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">`;
  ticks.forEach(t=>{out+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`});
  (opts.guides||[]).forEach(g=>{out+=`<line x1="${L}" x2="${W-R}" y1="${y(g.v)}" y2="${y(g.v)}" stroke="${g.color}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${L+4}" y="${y(g.v)-5}" font-size="11" font-weight="700" fill="${g.color}">${g.t}</text>`});
  series.forEach(s=>{const d=s.pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
    out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pts.forEach((p,i)=>{out+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${i===s.pts.length-1?4.5:2.5}" fill="${s.color}"/>`});
    const lp=s.pts[s.pts.length-1];out+=`<text x="${x(lp[0])-9}" y="${y(lp[1])+(s.below?18:-10)}" text-anchor="end" font-size="13" font-weight="700" fill="${s.color}" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${lp[1]}</text>`});
  out+=`<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${opts.first}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${opts.last}</text></svg>`;
  return out;
}
function md(k){return Number(k.slice(5,7))+'/'+Number(k.slice(8))}

async function aiPickModel(key){
  const r=await fetch('https://api.openai.com/v1/models',{headers:{Authorization:'Bearer '+key}});
  if(r.status===401)throw{code:'auth'};if(!r.ok)throw{code:'net'};
  const ids=((await r.json()).data||[]).map(m=>m.id);
  const pref=['gpt-6-luna','gpt-5-nano','gpt-5.4-nano','gpt-5-mini','gpt-4.1-nano','gpt-4.1-mini','gpt-4o-mini'];
  for(const p of pref)if(ids.includes(p))return p;
  const c=ids.filter(i=>/^gpt-/.test(i)&&/(nano|mini|luna)/.test(i)&&!/(audio|realtime|transcribe|tts|search|image)/.test(i)).sort();
  if(c.length)return c[0];
  const g=ids.filter(i=>/^gpt-/.test(i)&&!/(audio|realtime|transcribe|tts|search|image)/.test(i)).sort();
  if(g.length)return g[0];throw{code:'model'};
}
async function aiEstimate(){
  const q=ui.food.trim();if(!q||!S.ai.key||ui.aiBusy)return;
  ui.aiBusy=true;refreshSugg();
  try{
    if(!S.ai.model){S.ai.model=await aiPickModel(S.ai.key);save()}
    const prompt=`한국의 50대 사용자가 먹은 음식이야: "${q}"\n양이 없으면 한국 일반적인 1인분 기준으로, 음식마다 칼로리를 추정해.\n아래 JSON만 출력해. 다른 말은 쓰지 마.\n{"items":[{"name":"짧은 이름과 양","kcal":숫자}]}`;
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.ai.key},body:JSON.stringify({model:S.ai.model,messages:[{role:'user',content:prompt}]})});
    if(r.status===401)throw{code:'auth'};if(r.status===429)throw{code:'quota'};
    if(r.status===404||r.status===400){S.ai.model='';save();throw{code:'retry'}}
    if(!r.ok)throw{code:'net'};
    const j=await r.json();const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    const m=txt.match(/\{[\s\S]*\}/);const data=m?JSON.parse(m[0]):null;
    const items=(data&&Array.isArray(data.items)?data.items:[]).filter(it=>it&&typeof it.name==='string'&&isFinite(it.kcal)&&it.kcal>=0&&it.kcal<4000);
    if(!items.length)throw{code:'parse'};
    items.forEach(it=>{const n=it.name.slice(0,30);addFood({n,kcal:Number(it.kcal)});rememberFood(n,Number(it.kcal))});
    save();ui.food='';toast(`${items.length}개 추가했어요`);
  }catch(e){
    const c=e&&e.code;
    toast(c==='auth'?'ChatGPT 키가 맞지 않아요. 내 정보에서 확인해 주세요.':c==='quota'?'ChatGPT 사용 한도를 넘었어요. 잠시 뒤에 해 주세요.':c==='retry'?'다시 한 번 눌러 주세요.':c==='parse'?'계산하지 못했어요. 조금 더 자세히 적어 주세요.':'인터넷 연결을 확인해 주세요.');
  }finally{ui.aiBusy=false;render()}
}
function refreshSugg(){const el=document.getElementById('sugg');if(el)el.innerHTML=suggHtml()}

function onAct(ev){
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;const d=S.setup?day(TODAY):null;
  switch(a){
    case 'tab':ui.tab=b.dataset.v;ui.food='';render();window.scrollTo({top:0});return;
    case 'sex':if(!S.setup)captureSetup();S.profile.sex=b.dataset.v;save();render();return;
    case 'medAdd':{const el=document.getElementById('medNew');const n=el&&el.value.trim();if(!n){el&&el.focus();return}S.meds.push({id:uid(),n:n.slice(0,30)});save();captureSetup();render();const f=document.getElementById('medNew');if(f)f.focus();return}
    case 'medDel':S.meds=S.meds.filter(m=>m.id!==b.dataset.id);save();captureSetup();render();return;
    case 'finishSetup':{captureSetup();if(!S.meds.length&&!confirmNoMeds){confirmNoMeds=true;toast('약이 없으면 그대로 시작하기를 한 번 더 누르세요.');return}S.setup=true;save();ui.tab='today';render();window.scrollTo({top:0});return}
    case 'med':d.meds[b.dataset.id]=!d.meds[b.dataset.id];save();render();if(medsDone(TODAY)===S.meds.length)toast('오늘 약 다 드셨어요!');return;
    case 'medAll':S.meds.forEach(m=>d.meds[m.id]=true);save();render();toast('오늘 약 다 드셨어요!');return;
    case 'walk':d.walk=Math.max(0,Math.min(600,d.walk+Number(b.dataset.v)));save();render();return;
    case 'ex':d.ex[b.dataset.id]=!d.ex[b.dataset.id];save();render();return;
    case 'knee':d.knee=!d.knee;save();render();return;
    case 'how':ui.sheet={type:'how',id:b.dataset.id};renderSheet();return;
    case 'exDoneSheet':if(!d.ex[b.dataset.id]){d.ex[b.dataset.id]=true;save()}ui.sheet=null;renderSheet();render();return;
    case 'close':ui.sheet=null;renderSheet();return;
    case 'quick':{const f=quickFoods()[Number(b.dataset.i)];if(f){addFood(f);toast(f.n+' 추가')}render();return}
    case 'fadd':{const f=SUGG[Number(b.dataset.i)];if(f){addFood(f);toast(f.n+' 추가')}ui.food='';render();return}
    case 'ai':aiEstimate();return;
    case 'manual':ui.sheet={type:'manual',name:ui.food.trim()};renderSheet();return;
    case 'google':ui.sheet={type:'manual',name:ui.food.trim(),from:b.dataset.src||'google'};setTimeout(renderSheet,300);return;
    case 'manualSave':{const n=(document.getElementById('m_name').value||'').trim();const k=num('m_kcal');if(!n||k==null||k<0||k>5000){toast('이름과 칼로리를 넣어 주세요.');return}addFood({n:n.slice(0,30),kcal:k});rememberFood(n.slice(0,30),k);save();ui.sheet=null;ui.food='';renderSheet();render();toast(n+' 추가');return}
    case 'fq':{const f=d.foods.find(x=>x.id===b.dataset.id);if(f){const Q=[0.5,1,1.5,2];f.q=Q[(Q.indexOf(f.q)+1)%Q.length];save()}render();return}
    case 'fdel':d.foods=d.foods.filter(x=>x.id!==b.dataset.id);save();render();return;
    case 'prot':d.prot[b.dataset.v]=!d.prot[b.dataset.v];save();render();return;
    case 'bpAdd':{const s=num('bp_s'),di=num('bp_d'),p=num('bp_p');
      if(s==null||di==null||s<60||s>260||di<30||di>160||di>=s){toast('위, 아래 숫자를 확인해 주세요. 예: 125 / 82');return}
      const t=new Date();d.bp.push({s:Math.round(s),d:Math.round(di),p:p&&p>30&&p<220?Math.round(p):null,t:String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')});save();render();toast('혈압 저장했어요');return}
    case 'bpDel':d.bp.splice(Number(b.dataset.i),1);save();render();return;
    case 'pace':S.profile.pace=Number(b.dataset.v);save();render();return;
    case 'level':S.level=Number(b.dataset.v);save();render();return;
    case 'aiTest':{const k=(document.getElementById('ai_key').value||'').trim();if(!k){toast('키를 넣어 주세요.');return}
      b.disabled=true;b.textContent='확인 중…';
      aiPickModel(k).then(m=>{S.ai={key:k,model:m};save();toast('ChatGPT 연결됐어요');render()}).catch(e=>{toast(e&&e.code==='auth'?'키가 맞지 않아요.':'연결하지 못했어요. 인터넷을 확인해 주세요.');render()});return}
    case 'aiClear':S.ai={key:'',model:''};save();render();toast('연결을 끊었어요');return;
    case 'export':exportData();return;
  }
}
let confirmNoMeds=false;
function captureSetup(){
  const P=S.profile;const g=id=>document.getElementById(id);
  if(g('s_name'))P.name=g('s_name').value.trim().slice(0,12);
  const age=num('s_age'),h=num('s_height'),w=num('s_weight'),goal=num('s_goal');
  if(g('s_age'))P.age=age&&age>=20&&age<=110?Math.round(age):null;
  if(g('s_height'))P.height=h&&h>=120&&h<=220?r1(h):null;
  if(g('s_goal'))P.goal=goal&&goal>30&&goal<200?r1(goal):null;
  if(g('s_weight')&&w&&w>30&&w<200)day(TODAY).weight=r1(w);
}
function onChange(ev){
  const id=ev.target.id;const v=parseFloat(ev.target.value);const ok=isFinite(v);const P=S.profile;
  if(id==='weight'){day(TODAY).weight=ok&&v>30&&v<200?r1(v):null;save();render();return}
  if(id==='p_name'){P.name=ev.target.value.trim().slice(0,12)}
  else if(id==='p_age'){P.age=ok&&v>=20&&v<=110?Math.round(v):null}
  else if(id==='p_height'){P.height=ok&&v>=120&&v<=220?r1(v):null}
  else if(id==='p_goal'){P.goal=ok&&v>30&&v<200?r1(v):null}
  else if(id==='importfile'){const f=ev.target.files&&ev.target.files[0];if(f)importData(f);return}
  else return;
  save();render();
}
async function exportData(){
  const name='건강수첩-백업-'+TODAY+'.json';const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  S.lastBackup=TODAY;save();
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'건강수첩 백업'});render();return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);render();
}
async function importData(file){
  try{const v=JSON.parse(await file.text());if(!v||!v.profile||typeof v.days!=='object')throw 0;S=Object.assign(blank(),v);S.setup=true;save();toast('백업을 불러왔어요');render()}
  catch(e){toast('건강수첩 백업 파일이 아니에요.')}
}

const appEl=document.getElementById('app');
appEl.addEventListener('click',onAct);
document.getElementById('tabs').addEventListener('click',onAct);
const sheetEl=document.getElementById('sheet');
sheetEl.addEventListener('click',ev=>{if(ev.target===sheetEl){ui.sheet=null;renderSheet();return}onAct(ev)});
appEl.addEventListener('change',onChange);
appEl.addEventListener('input',ev=>{if(ev.target.id==='food'){ui.food=ev.target.value;refreshSugg()}});
appEl.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||ev.isComposing)return;
  if(ev.target.id==='food'){ev.preventDefault();if(S.ai.key&&!SUGG.length)aiEstimate();else ev.target.blur()}
  else if(ev.target.id==='medNew'){ev.preventDefault();onAct({target:document.querySelector('[data-act="medAdd"]')})}
  else if(ev.target.tagName==='INPUT')ev.target.blur();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&keyOf(new Date())!==TODAY)render()});
render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}</script>
